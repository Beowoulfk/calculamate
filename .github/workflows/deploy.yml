name: Deploy CalculaMate to GitHub Pages

# Publica la app estática (HTML/CSS/JS + Pyodide) en GitHub Pages.
# La app corre 100% en el navegador: SymPy se carga vía Pyodide desde un CDN.

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publicamos la carpeta de la app como raíz del sitio.
          path: ./calcula1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
